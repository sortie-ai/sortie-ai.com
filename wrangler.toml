# Cloudflare Workers static assets, not Pages. Deploy with `npx wrangler
# deploy`, never `wrangler pages deploy`. Hosting model: CLAUDE.md.

name = "www"
compatibility_date = "2026-08-11"

[assets]
directory = "./public"
not_found_handling = "404-page"

# Custom Domain, in version control rather than the dashboard.
# Matches the hostname EXACTLY — www needs its own proxied record and a redirect.
# Creating it can fail if a DNS record for the apex already exists; delete that first.
# Safe to attach while a redirect rule is live: Single Redirects run in
# http_request_dynamic_redirect, ahead of the Worker, so the cutover is reversible.
[[routes]]
pattern = "sortie-ai.com"
custom_domain = true
