<!DOCTYPE html>

<html lang="{{ site.Language.Lang }}" data-theme="dark">
<head>
{{ partial "head.html" . }}
</head>
{{/* The grid and washes are landing-page devices tied to the 1180 column.
     Scoping them here keeps 404 and the legal pages bare, per the spec. */}}
<body{{ if .IsHome }} class="home"{{ end }}>
<a class="skip" href="#main">Skip to content</a>

{{ partial "header.html" . }}

<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>

{{ partial "footer.html" . }}
</body>
</html>
