# Integration grid. `href` is relative to site.Params.docs, and blank renders
# an inert chip. `icon` is the basename of a file in assets/img/adapters/;
# `note` renders as the row's trailing sentence, prefixed with the item name.

groups:
  - id: trackers
    title: "Issue Trackers"
    items:
      - name: "Jira"
        icon: "jira"
        href: "/reference/adapter-jira/"
      - name: "GitHub"
        icon: "github"
        href: "/reference/adapter-github/"
      - name: "GitLab"
        icon: "gitlab"
        href: "/reference/adapter-gitlab/"
      - name: "Linear"
        icon: "linear"
        href: "/reference/adapter-linear/"
      - name: "Gitea"
        icon: "gitea"
        href: "/reference/adapter-gitea/"

  - id: agents
    title: "Agents"
    items:
      - name: "Claude Code"
        icon: "claude-code"
        href: "/reference/adapter-claude-code/"
      - name: "Codex"
        icon: "codex"
        href: "/reference/adapter-codex/"
      - name: "Copilot CLI"
        icon: "copilot-cli"
        href: "/reference/adapter-copilot/"
      - name: "OpenCode"
        icon: "opencode"
        href: "/reference/adapter-opencode/"
      # No href while /reference/adapter-gemini/ returns 404. The chip, the
      # og:description adapter list and this file name the same set and move
      # together on the day the adapter lands.
      - name: "Gemini"
        icon: "gemini"
      - name: "Kiro"
        icon: "kiro"
        href: "/reference/adapter-kiro/"

  - id: review
    title: "Pull requests and CI"
    items:
      - name: "GitHub"
        icon: "github"
        href: "/guides/connect-to-github/"
      - name: "GitLab"
        icon: "gitlab"
        href: "/guides/connect-to-gitlab/"
      - name: "Gitea"
        icon: "gitea"
        href: "/guides/connect-to-gitea/"
        note: "covers Forgejo and Codeberg."
