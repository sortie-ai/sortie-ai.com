# `id` is also the last segment of the copy beacon's path (/copied/sh), so it
# appears verbatim in Cloudflare's path data: renaming one breaks the history.
# It names the command copied, which is why the hero and closing band share it.
# `copyLabel` must stay distinct per method: it is the accessible name.

tabs:
  - id: sh
    label: "macOS / Linux"
    prompt: "$"
    command: "curl -sSL https://get.sortie-ai.com/install.sh | sh"
    copyLabel: "Copy install command"
  - id: brew
    label: "Homebrew"
    prompt: "$"
    command: "brew install --cask sortie-ai/tap/sortie"
    copyLabel: "Copy Homebrew command"
  - id: ps
    label: "Windows"
    prompt: ">"
    command: "irm 'https://get.sortie-ai.com/install.ps1' | iex"
    copyLabel: "Copy Windows command"
  - id: go
    label: "Go"
    prompt: "$"
    command: "go install github.com/sortie-ai/sortie/cmd/sortie@latest"
    copyLabel: "Copy go install command"
