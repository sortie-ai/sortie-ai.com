name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.164.0"
  NODE_VERSION: "24.19.0"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # enableGitInfo drives .Lastmod off the git author date. A shallow
          # clone yields no dates and does not error.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # --ignore-scripts skips the esbuild/workerd/fsevents postinstalls,
      # which nothing in this job needs.
      - name: Install pinned lint tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Hugo resolves .Date from lastmod too, so a future value drops the home
      # page from the build and the sitemap with no WARN. Before Build and
      # unconditional: downstream this surfaces as "missing public/index.html".
      - name: Home-page lastmod is not a future date
        run: python3 scripts/check-home-lastmod.py --no-future

      - name: Build
        run: hugo --gc --minify --logLevel info --printPathWarnings

      # Deprecations log at INFO; the default level hides them until they are
      # already errors.
      - name: Fail on deprecation notices
        run: |
          hugo --gc --minify --logLevel info 2>&1 | tee build.log
          if grep -q 'deprecated' build.log; then
            echo "::error::Build emitted deprecation notices"
            grep 'deprecated' build.log
            exit 1
          fi

      # Enforced here because nothing else catches a stray leading "v";
      # see hugo.toml for why it must stay bare.
      - name: params.version stays a bare X.Y.Z
        run: |
          grep -qE '^version = "[0-9]+\.[0-9]+\.[0-9]+"$' hugo.toml \
            || { echo "::error::params.version must be a bare X.Y.Z"; exit 1; }

      # Sources, not public/: a stale stylesheet can be served out of
      # resources/_gen/, so built CSS is not evidence of a source edit.
      - name: No raw colour literal in any stylesheet
        run: python3 scripts/no-raw-colour.py assets/css/*.css

      # Policy pages are listed by name: the docs site's consent banner links
      # straight at them, and nothing else in this gate would notice one gone.
      - name: Check required output exists
        run: |
          for f in public/index.html public/404.html public/robots.txt \
                   public/sitemap.xml public/site.webmanifest \
                   public/privacy/index.html public/cookies/index.html; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          ls public/css/*.css public/js/*.js public/fonts/*.woff2 >/dev/null

      - name: Validate structured data is an object, not a string
        run: |
          python3 - <<'PY'
          import json, re, sys
          html = open('public/index.html', encoding='utf-8').read()
          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not m:
              sys.exit('::error::no JSON-LD block found')
          data = json.loads(m.group(1))
          if not isinstance(data, dict):
              sys.exit('::error::JSON-LD parsed as %s — safeJS is probably missing' % type(data).__name__)
          print('JSON-LD OK:', [n['@type'] for n in data['@graph']])
          PY


      - name: Every fragment link resolves to an id, on every built page
        run: python3 scripts/check-anchors.py public

      - name: Heading ids and levels match the committed baseline
        run: python3 scripts/check-heading-ids.py --check

      # Compares changed <main> text against the PR base, not changed paths, so
      # a CSS-only edit is exempt. pull_request only: a push has no base ref
      # to diff against.
      - name: Home-page lastmod moves when the home page's text does
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check-home-lastmod.py \
            "${{ github.event.pull_request.base.sha }}"

      - name: Validate HTML
        # One invocation per file, list taken from the build: given several paths
        # html-validate exits 0 while any one matches, and a hardcoded list
        # leaves a new page unvalidated. Absence is the existence step's job.
        run: |
          hv=node_modules/.bin/html-validate
          test -x "$hv" \
            || { echo "::error::$hv missing — npm ci did not run"; exit 1; }
          test -f .htmlvalidate.json \
            || { echo "::error::.htmlvalidate.json missing — html-validate would silently pass"; exit 1; }

          # `extends` lists :a11y even though :recommended covers the same rules
          # today, so a future preset split can't silently drop them. Kept here,
          # not in .htmlvalidate.json, because that file is parsed as strict JSON.
          # html-validate resolves config from the target file's directory,
          # not the cwd. Assert a rule only this repo's `extends` pulls in,
          # or a silent fallback to defaults checks the wrong rule set.
          "$hv" --print-config public/index.html | grep -q '"heading-level"' \
            || { echo "::error::.htmlvalidate.json is not in force for public/"; exit 1; }
          pages="$(mktemp)"
          find public -name '*.html' | sort > "$pages"
          test -s "$pages" \
            || { echo "::error::no built HTML found — the check cannot fail"; exit 1; }
          fail=0
          while IFS= read -r page; do
            "$hv" "$page" || fail=1
          done < "$pages"
          rm -f "$pages"
          exit $fail
