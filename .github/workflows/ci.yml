name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # enableGitInfo reads the git author date to populate .Lastmod for
          # sitemap.xml. A shallow clone yields no dates and does not error,
          # so the failure would be silent.
          fetch-depth: 0

      - name: Read pinned tool versions
        id: tools
        run: |
          echo "hugo=$(grep '^gohugo ' .tool-versions | awk '{print $2}' | sed 's/^extended_//')" >> "$GITHUB_OUTPUT"
          echo "node=$(grep '^nodejs ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tools.outputs.node }}

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.tools.outputs.hugo }}
          extended: true

      - name: Build
        run: hugo --gc --minify --logLevel info --printPathWarnings

      # Deprecation notices start life at INFO, so the default log level hides
      # them until they have already escalated to an error. Fail early instead.
      - name: Fail on deprecation notices
        run: |
          hugo --gc --minify --logLevel info 2>&1 | tee build.log
          if grep -q 'deprecated' build.log; then
            echo "::error::Build emitted deprecation notices"
            grep 'deprecated' build.log
            exit 1
          fi

      - name: Verify the etalon was not modified
        run: |
          # src/index.html is the read-only source of truth for the copy and
          # the design. A change to it must be deliberate and reviewed.
          test "$(stat -c%s src/index.html)" = "60737" \
            || { echo "::error::src/index.html changed size — was that intended?"; exit 1; }

      - name: Verify the rendered copy still matches the etalon
        # Catches copy drift: any wording difference that is not one of the
        # sanctioned factual corrections fails the build.
        run: python3 scripts/verify-etalon.py

      - name: Check required output exists
        run: |
          for f in public/index.html public/404.html public/robots.txt \
                   public/sitemap.xml public/site.webmanifest; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # Fingerprinted assets: at least one of each must be present.
          ls public/css/*.css public/js/*.js public/fonts/*.woff2 >/dev/null

      - name: Validate structured data is an object, not a string
        run: |
          python3 - <<'PY'
          import json, re, sys
          html = open('public/index.html', encoding='utf-8').read()
          m = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not m:
              sys.exit('::error::no JSON-LD block found')
          data = json.loads(m.group(1))
          if not isinstance(data, dict):
              sys.exit('::error::JSON-LD parsed as %s — safeJS is probably missing' % type(data).__name__)
          print('JSON-LD OK:', [n['@type'] for n in data['@graph']])
          PY

      - name: Validate HTML
        # .htmlvalidate.json is required, not optional: with no config file
        # html-validate validates nothing and still exits 0, so this step would
        # report green while checking no rules at all.
        run: |
          test -f .htmlvalidate.json \
            || { echo "::error::.htmlvalidate.json missing — html-validate would silently pass"; exit 1; }
          npx --yes html-validate public/index.html public/404.html
