name: Release sync

# Bring params.version in hugo.toml up to the latest published Sortie release.
# The dispatch is a doorbell: the version is read from the Releases API, never
# from the client payload. Rationale: CLAUDE.md.

on:
  repository_dispatch:
    # Sent by sortie-ai/sortie release.yml, job notify-sites. Fires only for a
    # workflow file already on the default branch: no effect until merged.
    types: [sortie-release]
  workflow_dispatch:

permissions:
  contents: read

# A second release landing while this one is mid-flight would race on the push.
concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  bump:
    name: Bump params.version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # PAT, not GITHUB_TOKEN: a push authored by GITHUB_TOKEN starts no
          # workflow run, silently skipping ci.yml on the one commit that
          # changes what the site renders.
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}

      - name: Resolve the latest published release
        id: release
        env:
          # The same PAT: a fine-grained token always reads public repos,
          # whereas GITHUB_TOKEN's cross-repo reach is undocumented.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          CLAIMED: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/sortie-ai/sortie/releases/latest --jq '.tag_name')

          # Tags are v-prefixed from 1.19.0 on; the version number stays bare.
          # Strip here and nowhere else — a "v" reaching params.version corrupts
          # softwareVersion, the nav chip, the footer and llms.txt, unflagged.
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest release tag '${TAG}' does not normalise to a bare X.Y.Z version"
            exit 1
          fi

          if [ -n "${CLAIMED}" ] && [ "${CLAIMED}" != "${VERSION}" ]; then
            echo "::warning::dispatch announced ${CLAIMED} but the latest published release is ${VERSION}; using ${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "✓ latest published release is ${VERSION}"

      - name: Rewrite hugo.toml
        id: rewrite
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # Assert the key is unique before editing, so a future restructuring
          # of hugo.toml fails here instead of rewriting the wrong line.
          count=$(grep -c '^version = "' hugo.toml)
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one '^version = \"' line in hugo.toml, found ${count}"
            exit 1
          fi

          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' hugo.toml)
          if [ "$current" = "$VERSION" ]; then
            echo "✓ hugo.toml already reads ${VERSION} — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" hugo.toml
          grep -qx "version = \"${VERSION}\"" hugo.toml \
            || { echo "::error::rewrite did not take"; exit 1; }

          echo "✓ params.version ${current} -> ${VERSION}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "previous=${current}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: ${{ steps.rewrite.outputs.changed == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.rewrite.outputs.previous }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage by name, never `git add -A`.
          git add hugo.toml
          git commit \
            -m "chore: set params.version to ${VERSION}" \
            -m "sortie ${VERSION} is published upstream. params.version feeds the nav chip, the footer text, the JSON-LD softwareVersion and llms.txt, so the bump is the whole change."
          git push origin HEAD:refs/heads/main
          echo "### params.version ${PREVIOUS} -> ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
