baseURL = "https://sortie-ai.com/"
title = "Sortie"
locale = "en-US"
defaultContentLanguage = "en"

# Exposed by wrangler.toml as the Workers static-assets directory.
publishDir = "public"

# Populates .Lastmod from the git author date, which feeds sitemap.xml.
# Requires full git history: a shallow clone silently produces no dates.
enableGitInfo = true

# Required by layouts/robots.txt; without it no robots.txt is emitted at all.
enableRobotsTXT = true

# No taxonomies, no feed: the empty /tags/ and /categories/ pages read as thin
# content.
disableKinds = ["taxonomy", "term", "rss"]

# Legacy brute-force rewriting, slated for removal upstream. Not needed.
canonifyURLs = false

[outputs]
home = ["html", "llmstxt"]
page = ["html"]

# /llms.txt per https://llmstxt.org, rendered by layouts/home.llmstxt.txt.
# mediaType is text/plain, which lands the file at /llms.txt; static/_headers
# then serves it as text/markdown, matching the llms.txt spec.
[outputFormats.llmstxt]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[sitemap]
filename = "sitemap.xml"
# Google ignores both hints and has said so; emitting them is noise.
changefreq = ""
priority = -1

[frontmatter]
# `lastmod` ahead of `:git` so a page can carry an explicit date: the home
# page's copy lives in layouts/home.html, which `:git` never reads. A page with
# no `lastmod` key still resolves through `:git` and stays maintenance-free.
lastmod = ["lastmod", ":git", ":default"]

[markup.goldmark.renderer]
# For inline HTML in the legal pages' Markdown.
unsafe = true

[minify]
disableHTML = false
[minify.tdewolff.html]
keepQuotes = true
keepDocumentTags = true

[params]
# The six vertical hairlines behind the landing page, on a 236px step. The
# mockup draws them; the site ships without them. True emits body.vgrid, the
# only selector the grid rules in assets/css/main.css answer to.
verticalGrid = false

# Feeds the nav chip, footer, JSON-LD softwareVersion and llms.txt. NEVER add a
# leading `v`: git tags gained one from 1.19.0 on, but the number itself stays
# bare, and schema.org's free-form Text type means no validator flags a stray `v`.
version = "1.20.0"

description = "Sortie turns issue tracker tickets into autonomous coding agent sessions. A single Go binary with pluggable adapters for trackers, agents, and Git forges."
llmsDescription = "Sortie is an autonomous coding agent orchestrator. It picks up issues from your tracker, runs a coding agent against each one in an isolated workspace, and writes the result back to the ticket. Engineers manage work at the ticket level — Sortie handles retry logic, state reconciliation, and cost tracking. A single Go binary with zero dependencies and SQLite persistence. Trackers, coding agents, and Git forges are all pluggable adapters; the Reference section below lists the ones that ship today. Apache-2.0. The binary sends no telemetry."

docs = "https://docs.sortie-ai.com"
github = "https://github.com/sortie-ai/sortie"
org = "https://github.com/sortie-ai"

# ogImage is shared with the docs site; update one copy without the other and the cards diverge.
ogImage = "img/og-image.jpg"
ogImageAlt = "Sortie - Turn tracker tickets into agent sessions"

[params.author]
name = "Sortie AI"

